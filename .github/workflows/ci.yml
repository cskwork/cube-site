name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - run: npm run test

      # Same sub-path the Pages workflow uses, so a base-path break shows up on the PR.
      - name: Build with the GitHub Pages base path
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build
